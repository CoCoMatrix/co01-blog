const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const unb64 = buf => { let s = ""; new Uint8Array(buf).forEach(b => s += String.fromCharCode(b)); return btoa(s); };

async function open_with(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const data = b64(PAYLOAD);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: data.slice(0, 12) }, key, data.slice(12)));
  const k = unb64(raw);
  document.open();
  document.write(html.replace("<head>", `<head>\n<script>window.CO01K = "${k}";<\/script>`));
  document.close();
}

async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(SALT), iterations: ITER }, base, 256);
}

document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const go = document.getElementById("go"), msg = document.getElementById("msg");
  go.disabled = true; msg.textContent = "";
  try { await open_with(await derive(document.getElementById("pw").value)); }
  catch (err) { msg.textContent = "Wrong password."; go.disabled = false; }
};

try { sessionStorage.removeItem("co01k"); } catch (e) {}
